# DEMO CONTENT — public repository, therefore NOT secret (ADR-009).
# Design record: docs/content-design/distinct-in-windows.md (bank expansion batch A3, 2026-10-25).

slug = "distinct-in-windows"
title = "Distinct values in every window"
family = "sliding-window"
statement = "statement.md"
harness = "harness.cpp"
reference = "reference.cpp"
solution_file = "solution.cpp" # name the student's code is compiled under
interface = "std::vector<int> distinct_in_windows(const std::vector<int>& a, int k);"
# Bank expansion (2026-10-25): new problems are not recommendable (CE1 decision E2 applied to
# every new problem). They stay in the problem list and their attempts produce skill evidence.
recommendable = false

[skills]
tie_resolution = "Handling equal values as the specification says: which of several equal candidates wins, and whether duplicates count separately."
loop_bounds = "Visiting exactly the positions the task needs: a loop starts and ends at the right index and runs from the right end."
window_maintenance = "Keeping a sliding window's state current: removing the element that leaves, and shrinking the window rather than restarting it."

[probes]
value_leaves = ["window_maintenance"]
value_leaves_fully = ["window_maintenance"]
duplicates_in_window = ["tie_resolution"]
last_window = ["loop_bounds"]
k_equals_n = ["loop_bounds"]
large_input = ["window_maintenance"]

[curriculum]
assumes = ["std::unordered_map or std::map counts"]
prerequisites = ["max-window-sum"]

[[tests]]
key = "sample_typical"
visibility = "sample"
input = "L 7 1 2 1 3 4 2 3 4"
expected = "3 4 4 3"
probes = ["value_leaves", "duplicates_in_window", "last_window"]
student_description = "Windows of four."
purpose = "Visible typical case."
distinguishes = ["counts_unique_only", "keeps_zero_counts", "misses_last_window"]

[[tests]]
key = "sample_all_same"
visibility = "sample"
input = "L 5 7 7 7 7 7 2"
expected = "1 1 1 1"
probes = ["duplicates_in_window"]
student_description = "Every value equal."
purpose = "Visible case: one distinct value per window."
distinguishes = ["counts_unique_only", "misses_last_window"]

[[tests]]
key = "all_distinct"
input = "L 6 1 2 3 4 5 6 3"
expected = "3 3 3 3"
probes = ["value_leaves_fully", "last_window"]
student_description = "No repeated values."
purpose = "Every window has k distinct values."
distinguishes = ["keeps_zero_counts", "misses_last_window"]

[[tests]]
key = "value_returns"
input = "L 6 5 6 5 6 5 6 2"
expected = "2 2 2 2 2"
probes = ["value_leaves", "duplicates_in_window"]
student_description = "Two values alternate."
purpose = "A leaving value is still present in the window."
distinguishes = ["misses_last_window"]

[[tests]]
key = "leaves_for_good"
input = "L 6 9 9 1 2 3 4 3"
expected = "2 3 3 3"
probes = ["value_leaves_fully"]
student_description = "A repeated value at the start that never returns."
purpose = "Values leave the window completely."
distinguishes = ["counts_unique_only", "keeps_zero_counts", "misses_last_window"]

[[tests]]
key = "k_equals_n"
input = "L 4 3 1 3 2 4"
expected = "3"
probes = ["k_equals_n", "duplicates_in_window", "last_window"]
student_description = "The window is the whole array."
purpose = "Only one window."
distinguishes = ["counts_unique_only", "misses_last_window"]

[[tests]]
key = "k_one"
input = "L 4 8 8 2 8 1"
expected = "1 1 1 1"
probes = ["last_window"]
student_description = "Windows of one element."
purpose = "Every count is 1."
distinguishes = ["keeps_zero_counts", "misses_last_window"]

[[tests]]
key = "pairs_in_window"
input = "L 6 1 1 2 2 3 3 4"
expected = "2 3 2"
probes = ["duplicates_in_window", "value_leaves"]
student_description = "Each value appears twice in a row."
purpose = "Duplicates inside each window."
distinguishes = ["counts_unique_only", "keeps_zero_counts", "misses_last_window"]

[[tests]]
key = "new_at_end"
input = "L 5 4 4 4 4 9 2"
expected = "1 1 1 2"
probes = ["last_window", "value_leaves_fully"]
student_description = "A new value only in the last position."
purpose = "The last window differs from the others."
distinguishes = ["counts_unique_only", "misses_last_window"]

[[tests]]
key = "single"
input = "L 1 0 1"
expected = "1"
probes = ["k_equals_n", "last_window"]
student_description = "One element."
purpose = "Minimal input."
distinguishes = ["misses_last_window"]

[[tests]]
key = "large_cycle"
input = "R 100000 1 0 50 0 100"
expected = "len=99901 first=50 last=50 hash=831920806570533987"
probes = ["large_input", "value_leaves", "duplicates_in_window"]
student_description = "A long array cycling through 50 values."
purpose = "Large input; every window holds all 50 values."
distinguishes = ["counts_unique_only", "misses_last_window"]

[[tests]]
key = "large_distinct"
input = "R 100000 1 0 100000 0 1000"
expected = "len=99001 first=1000 last=1000 hash=1871139304174029945"
probes = ["large_input", "value_leaves_fully"]
student_description = "A long array without repeats."
purpose = "Large input; every value leaves for good."
distinguishes = ["keeps_zero_counts", "misses_last_window"]

[[error_models]]
key = "keeps_zero_counts"
file = "error_models/keeps_zero_counts.cpp"
skill = "window_maintenance"
description = "Counts values that have left the window: the count is decremented but the key is never erased at zero (never removing the leaving element at all, or a set that only grows, gives identical output)."
student_hint = "When a value's count drops to 0, is it still in the window? Does your container still count it?"

[[error_models]]
key = "misses_last_window"
file = "error_models/misses_last_window.cpp"
skill = "loop_bounds"
description = "The loop stops one element early, so the last window gets no count."
student_hint = "How many windows of size k does an array of n elements have? Count yours."

[[error_models]]
key = "counts_unique_only"
file = "error_models/counts_unique_only.cpp"
skill = "tie_resolution"
description = "Counts the values that occur exactly once in the window instead of the distinct values."
student_hint = "If a value appears twice in a window, does it count as one distinct value or as none?"
