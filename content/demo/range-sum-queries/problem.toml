# DEMO CONTENT — public repository, therefore NOT secret (ADR-009).
# Design record: docs/content-design/range-sum-queries.md (bank expansion batch A4, 2026-10-25).

slug = "range-sum-queries"
title = "Range sums with prefix sums"
family = "prefix-sums"
statement = "statement.md"
harness = "harness.cpp"
reference = "reference.cpp"
solution_file = "solution.cpp" # name the student's code is compiled under
interface = "std::vector<long long> range_sums(const std::vector<int>& a, const std::vector<std::pair<int, int>>& queries);"
# Bank expansion (2026-10-25): new problems are not recommendable (CE1 decision E2 applied to
# every new problem). They stay in the problem list and their attempts produce skill evidence.
recommendable = false

[skills]
index_range = "Visiting exactly the valid positions: the loop's start and end cover every element once."
update_rule = "Updating every piece of tracked state on each step (running candidates, pointers, window edges) so no candidate is lost."
output_contract = "Returning exactly what the specification asks for: an index or a value, a sentinel when there is no answer."

[probes]
right_end_counts = ["index_range"]
long_range = ["update_rule"]
left_not_zero = ["output_contract"]
single_element_range = ["index_range", "update_rule"]
large_input = ["update_rule"]

[curriculum]
assumes = ["building an array of running totals"]
prerequisites = ["pivot-index"]

[[tests]]
key = "sample_typical"
visibility = "sample"
input = "L 6 3 -1 4 1 5 -9 3 0 2 1 4 2 5"
expected = "6 9 1"
probes = ["right_end_counts", "long_range", "left_not_zero"]
student_description = "Three queries on a small array."
purpose = "Visible typical case."
distinguishes = ["excludes_right_end", "ignores_left_end", "prefix_not_accumulated"]

[[tests]]
key = "sample_whole"
visibility = "sample"
input = "L 4 1 2 3 4 1 0 3"
expected = "10"
probes = ["right_end_counts", "long_range"]
student_description = "One query over the whole array."
purpose = "Visible case starting at index 0."
distinguishes = ["excludes_right_end", "prefix_not_accumulated"]

[[tests]]
key = "single_elements"
input = "L 5 7 -2 9 0 4 3 0 0 2 2 4 4"
expected = "7 9 4"
probes = ["single_element_range", "left_not_zero"]
student_description = "Queries of one element each."
purpose = "l = r."
distinguishes = ["excludes_right_end", "ignores_left_end", "prefix_not_accumulated"]

[[tests]]
key = "from_start"
input = "L 5 2 4 6 8 10 2 0 1 0 4"
expected = "6 30"
probes = ["long_range", "right_end_counts"]
student_description = "Queries starting at index 0."
purpose = "Prefix queries."
distinguishes = ["excludes_right_end", "prefix_not_accumulated"]

[[tests]]
key = "middle_ranges"
input = "L 7 5 1 -3 2 2 8 -1 3 1 3 2 5 4 6"
expected = "0 9 9"
probes = ["left_not_zero", "long_range", "right_end_counts"]
student_description = "Queries in the middle of the array."
purpose = "l > 0 for every query."
distinguishes = ["excludes_right_end", "ignores_left_end", "prefix_not_accumulated"]

[[tests]]
key = "zero_right_end"
input = "L 5 4 4 4 0 9 2 1 3 0 3"
expected = "8 12"
probes = ["right_end_counts"]
student_description = "Queries ending at a zero."
purpose = "Excluding a[r] changes nothing here; other tests carry the evidence."
distinguishes = ["ignores_left_end", "prefix_not_accumulated"]

[[tests]]
key = "negatives"
input = "L 5 -4 -6 -1 -8 -2 2 1 3 0 4"
expected = "-15 -21"
probes = ["long_range", "left_not_zero"]
student_description = "Negative values."
purpose = "Negative range sums."
distinguishes = ["excludes_right_end", "ignores_left_end", "prefix_not_accumulated"]

[[tests]]
key = "single_value_array"
input = "L 1 -7 1 0 0"
expected = "-7"
probes = ["single_element_range"]
student_description = "One element, one query."
purpose = "Minimal input."
distinguishes = ["excludes_right_end"]

[[tests]]
key = "repeated_query"
input = "L 4 1 1 1 1 3 1 2 1 2 1 2"
expected = "2 2 2"
probes = ["left_not_zero", "single_element_range"]
student_description = "The same query three times."
purpose = "Answers do not depend on earlier queries."
distinguishes = ["excludes_right_end", "ignores_left_end", "prefix_not_accumulated"]

[[tests]]
key = "large_many_queries"
input = "G 100000 37 11 20001 -10000 100000"
expected = "len=100000 first=-9989 last=-38304 hash=6669029663825606325"
probes = ["large_input", "long_range"]
student_description = "A long array with many queries."
purpose = "Large input; O(n + q) needed."
distinguishes = ["excludes_right_end", "ignores_left_end", "prefix_not_accumulated"]

[[error_models]]
key = "excludes_right_end"
file = "error_models/excludes_right_end.cpp"
skill = "index_range"
description = "Uses prefix[r] - prefix[l], so a[r] is left out of every range."
student_hint = "Is a[r] part of the range from l to r? Check which prefix entries you subtract."

[[error_models]]
key = "prefix_not_accumulated"
file = "error_models/prefix_not_accumulated.cpp"
skill = "update_rule"
description = "Stores each element instead of the running total, so the prefix array is just a shifted copy of a."
student_hint = "What should prefix[i + 1] contain: a[i] alone, or everything up to a[i]?"

[[error_models]]
key = "ignores_left_end"
file = "error_models/ignores_left_end.cpp"
skill = "output_contract"
description = "Returns prefix[r + 1], the sum from the start of the array, ignoring l."
student_hint = "Does your answer change when l changes? Try a query that does not start at index 0."
