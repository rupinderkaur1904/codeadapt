# DEMO CONTENT — public repository, therefore NOT secret (ADR-009).
# Real study problems live in a private content repository.

slug = "last-less-than"
title = "Last element less than"
family = "binary-search"
statement = "statement.md"
harness = "harness.cpp"
reference = "reference.cpp"
solution_file = "solution.cpp"
interface = "int last_less_than(const std::vector<int>& a, int target);"
# Library calls the statement forbids (D1, ADR-035): an attempt naming one gives no skill
# observations. Must match the statement's "Do not call" sentence.
banned_names = ["std::equal_range", "std::lower_bound", "std::partition_point", "std::upper_bound"]

[skills]
search_space_boundaries = "Initialising and updating the bounds of the search space so every candidate answer stays reachable."
loop_termination = "Ensuring each iteration shrinks the search space so the loop terminates."
equality_handling = "Choosing the comparison so equal elements land on the correct side of the boundary."
problem_specification = "Returning what the specification asks for, including when the target is absent."

# Probe -> skill mapping is a modelling assumption, not a fact.
[probes]
empty_input = ["search_space_boundaries", "problem_specification"]
target_below_all = ["problem_specification"]
target_above_all = ["search_space_boundaries"]
target_present_unique = ["equality_handling"]
target_present_duplicates = ["equality_handling"]
target_absent_between = ["problem_specification"]
single_element = ["search_space_boundaries", "loop_termination"]
two_elements = ["loop_termination"]
large_input = ["loop_termination"]

# Links to other problems by slug (docs/content-design/README.md section 1.6).
[curriculum]
assumes = ["lower bound of a sorted array"]
prerequisites = ["lower-bound"]
equivalents = ["count-occurrences"]

[[tests]]
key = "sample_present"
visibility = "sample"
input = "L 4 1 3 3 7 3"
expected = "0"
probes = ["target_present_duplicates"]
student_description = "The target appears in the array."
purpose = "Visible case with the target present."
distinguishes = ["no_progress_update", "returns_insertion_point", "uses_le"]

[[tests]]
key = "sample_between"
visibility = "sample"
input = "L 4 1 3 3 7 5"
expected = "2"
probes = ["target_absent_between"]
student_description = "The target is absent and falls between two elements."
purpose = "Visible absent-target case."
distinguishes = ["no_progress_update", "returns_insertion_point"]

[[tests]]
key = "empty"
input = "L 0 3"
expected = "-1"
probes = ["empty_input"]
student_description = "The array is empty."
purpose = "Minimal input (n = 0): the answer is -1."
distinguishes = ["clamps_to_zero", "returns_insertion_point"]

[[tests]]
key = "below_all"
input = "L 3 2 4 6 1"
expected = "-1"
probes = ["target_below_all"]
student_description = "The target is smaller than every element."
purpose = "No element is smaller: the answer is -1."
distinguishes = ["clamps_to_zero", "returns_insertion_point"]

[[tests]]
key = "equal_first"
input = "L 3 2 4 6 2"
expected = "-1"
probes = ["target_below_all", "target_present_unique"]
student_description = "The target equals the first element."
purpose = "Only element equal or larger at index 0: -1, and separates uses_le."
distinguishes = ["clamps_to_zero", "returns_insertion_point", "uses_le"]

[[tests]]
key = "above_all"
input = "L 3 2 4 6 9"
expected = "2"
probes = ["target_above_all"]
student_description = "The target is larger than every element."
purpose = "Answer is the last index: is n - 1 reachable?"
distinguishes = ["hi_init_last_index", "no_progress_update", "returns_insertion_point"]

[[tests]]
key = "equal_last"
input = "L 3 2 4 6 6"
expected = "1"
probes = ["target_present_unique"]
student_description = "The target equals the last element."
purpose = "Target at the last index; equality at the other end."
distinguishes = ["no_progress_update", "returns_insertion_point", "uses_le"]

[[tests]]
key = "duplicates_middle"
input = "L 6 1 2 2 2 2 3 2"
expected = "0"
probes = ["target_present_duplicates"]
student_description = "The target appears several times in a row."
purpose = "Run of the target; the answer is just before the run."
distinguishes = ["no_progress_update", "returns_insertion_point", "uses_le"]

[[tests]]
key = "duplicates_all"
input = "D 7 5 5"
expected = "-1"
probes = ["target_present_duplicates", "target_below_all"]
student_description = "Every element equals the target."
purpose = "Every element equals the target: the answer is -1."
distinguishes = ["clamps_to_zero", "returns_insertion_point", "uses_le"]

[[tests]]
key = "single_below"
input = "L 1 4 9"
expected = "0"
probes = ["single_element", "target_above_all"]
student_description = "A one-element array whose element is smaller than the target."
purpose = "Smallest case whose answer is the last index."
distinguishes = ["hi_init_last_index", "no_progress_update", "returns_insertion_point"]

[[tests]]
key = "single_equal"
input = "L 1 4 4"
expected = "-1"
probes = ["single_element", "target_present_unique"]
student_description = "A one-element array containing the target."
purpose = "Smallest equality case: the answer is -1."
distinguishes = ["clamps_to_zero", "returns_insertion_point", "uses_le"]

[[tests]]
key = "two_between"
input = "L 2 1 9 5"
expected = "0"
probes = ["two_elements", "target_absent_between"]
student_description = "A two-element array with the target between the elements."
purpose = "Smallest input on which a non-shrinking update loops."
distinguishes = ["no_progress_update", "returns_insertion_point"]

[[tests]]
key = "large_between"
input = "A 200000 0 2 99999"
expected = "49999"
probes = ["large_input", "target_absent_between"]
student_description = "A large array where the target is absent."
purpose = "Scale, target absent. Does not test the O(log n) requirement."
distinguishes = ["no_progress_update", "returns_insertion_point"]

[[tests]]
key = "large_above_all"
input = "A 200000 0 2 1000000000"
expected = "199999"
probes = ["large_input", "target_above_all"]
student_description = "A large array where the target is larger than every element."
purpose = "Scale version of above_all. Does not test the O(log n) requirement."
distinguishes = ["hi_init_last_index", "no_progress_update", "returns_insertion_point"]

[[tests]]
key = "large_duplicates"
input = "D 200000 7 7"
expected = "-1"
probes = ["large_input", "target_present_duplicates"]
student_description = "A large array in which every element equals the target."
purpose = "Scale version of duplicates_all. Does not test the O(log n) requirement."
distinguishes = ["clamps_to_zero", "returns_insertion_point", "uses_le"]

[[error_models]]
key = "uses_le"
file = "error_models/uses_le.cpp"
skill = "equality_handling"
description = "Uses a[mid] <= target where a[mid] < target is required, so it returns the last element less than or equal to the target."
student_hint = "Check whether an element equal to the target should count as less than it."
known_limitation = "Attribution not unique (owner approval 2026-10-26, L20 safeguard S1 for the original problems): a correct search for the last element <= target (a misread task) gives identical output on every committed test and on every input of the exhaustive and random search domains, so no test can separate an equality error from a specification error. Diagnoses are reported as qualified and add no equality_handling evidence (docs/reviews/2026-10-26/l20-search-original.md, case O2)."

[[error_models]]
key = "returns_insertion_point"
file = "error_models/returns_insertion_point.cpp"
skill = "problem_specification"
description = "Returns the boundary (the first index with a[i] >= target) instead of the index just before it."
student_hint = "Re-read which index the specification asks for, relative to the boundary your search finds."

[[error_models]]
key = "clamps_to_zero"
file = "error_models/clamps_to_zero.cpp"
skill = "problem_specification"
description = "Returns 0 instead of -1 when no element is less than the target."
student_hint = "Re-read what should be returned when no element is less than the target."
known_limitation = "Attribution not unique (owner approval 2026-10-26, L20 safeguard S1 for the original problems): a closed-interval search whose answer variable starts at 0 instead of -1 gives identical output on every committed test and on every input of the exhaustive and random search domains, so no test can separate a specification error from a search-range error. Diagnoses are reported as qualified and add no problem_specification evidence (docs/reviews/2026-10-26/l20-search-original.md, case O3)."

[[error_models]]
key = "hi_init_last_index"
file = "error_models/hi_init_last_index.cpp"
skill = "search_space_boundaries"
description = "Initialises hi = n - 1 with a half-open loop, so the boundary n is unreachable and the last index is never returned."
student_hint = "Can your search ever return the last index? Check the initial bounds of the search space."
known_limitation = "Detected only by tests whose answer is the last index (one behaviour group). Any error that cannot return n - 1 produces the same failures, so diagnoses are reported as qualified."

[[error_models]]
key = "no_progress_update"
file = "error_models/no_progress_update.cpp"
skill = "loop_termination"
description = "Updates lo = mid instead of lo = mid + 1; when two candidates remain the search space stops shrinking and the loop does not terminate."
student_hint = "Make sure every iteration of your loop strictly shrinks the search range."

# Declared skills that no error model can give negative evidence for (ADR-034).
[positive_only_skills]
search_space_boundaries = "Its only model, hi_init_last_index, rests on one behaviour group and carries a known_limitation, so this skill can only receive correct observations through rule C (L19). Recorded explicitly when this check was introduced (ADR-034); no mapping was changed."
equality_handling = "Its only model, uses_le, carries a known_limitation after L20 safeguard S1 for the original problems (owner request 2026-10-26, case O2), so this skill can only receive correct observations through rule C (L19). The mapping itself was not changed."
