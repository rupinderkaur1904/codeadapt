# DEMO CONTENT — public repository, therefore NOT secret (ADR-009).
# Design record: docs/content-design/container-water.md (bank expansion batch A2, 2026-10-25).

slug = "container-water"
title = "Container with most water"
family = "two-pointers"
statement = "statement.md"
harness = "harness.cpp"
reference = "reference.cpp"
solution_file = "solution.cpp" # name the student's code is compiled under
interface = "int max_water(const std::vector<int>& height);"
# Bank expansion (2026-10-25): new problems are not recommendable (CE1 decision E2 applied to
# every new problem). They stay in the problem list and their attempts produce skill evidence.
recommendable = false

[skills]
output_contract = "Returning exactly what the specification asks for: an index or a value, a sentinel when there is no answer."
loop_bounds = "Visiting exactly the positions the task needs: a loop starts and ends at the right index and runs from the right end."
range_inclusion = "Counting or summing over exactly the right set of positions: interval lengths, inclusive or exclusive ends, and whether an element may pair with itself or belongs to a side."
pointer_movement = "Moving the right pointer at each step of a two-pointer scan, and doing the comparison or write that each move depends on."

[probes]
inner_pair_best = ["pointer_movement"]
adjacent_best = ["loop_bounds"]
width_counts = ["range_inclusion"]
shorter_limits = ["output_contract"]
large_input = ["pointer_movement"]

[curriculum]
assumes = ["two indices moving towards each other"]
prerequisites = ["closest-pair-sum"]

[[tests]]
key = "sample_classic"
visibility = "sample"
input = "L 9 1 8 6 2 5 4 8 3 7"
expected = "49"
probes = ["inner_pair_best", "shorter_limits", "width_counts"]
student_description = "The classic example."
purpose = "Visible typical case."
distinguishes = ["moves_taller", "uses_taller_height", "width_plus_one"]

[[tests]]
key = "sample_two"
visibility = "sample"
input = "L 2 1 1"
expected = "1"
probes = ["adjacent_best", "width_counts"]
student_description = "Two lines of height 1."
purpose = "Visible minimal case."
distinguishes = ["stops_before_adjacent", "width_plus_one"]

[[tests]]
key = "outer_best"
input = "L 5 6 1 1 1 6"
expected = "24"
probes = ["width_counts", "shorter_limits"]
student_description = "The outermost lines are tallest."
purpose = "The answer is the outer pair."
distinguishes = ["width_plus_one"]

[[tests]]
key = "inner_tall_pair"
input = "L 6 1 9 2 2 9 1"
expected = "27"
probes = ["inner_pair_best"]
student_description = "Two tall lines inside short ones."
purpose = "Moving the taller pointer loses the inner pair."
distinguishes = ["moves_taller", "uses_taller_height", "width_plus_one"]

[[tests]]
key = "adjacent_tallest"
input = "L 5 1 0 0 9 9"
expected = "9"
probes = ["adjacent_best", "inner_pair_best"]
student_description = "The two tallest lines are neighbours."
purpose = "The best container has width 1."
distinguishes = ["moves_taller", "stops_before_adjacent", "uses_taller_height", "width_plus_one"]

[[tests]]
key = "neighbours_last"
input = "L 3 1 5 5"
expected = "5"
probes = ["adjacent_best"]
student_description = "Two equal tall lines at the end."
purpose = "The best pair is the last pair the pointers reach."
distinguishes = ["moves_taller", "stops_before_adjacent", "uses_taller_height", "width_plus_one"]

[[tests]]
key = "uneven_ends"
input = "L 4 2 3 4 10"
expected = "6"
probes = ["shorter_limits"]
student_description = "A very tall last line."
purpose = "The shorter line decides the level."
distinguishes = ["uses_taller_height", "width_plus_one"]

[[tests]]
key = "with_zeros"
input = "L 5 0 5 0 5 0"
expected = "10"
probes = ["shorter_limits", "inner_pair_best"]
student_description = "Some lines have height 0."
purpose = "Zero-height ends hold no water."
distinguishes = ["moves_taller", "uses_taller_height", "width_plus_one"]

[[tests]]
key = "increasing"
input = "L 6 1 2 3 4 5 6"
expected = "9"
probes = ["inner_pair_best", "width_counts"]
student_description = "Increasing heights."
purpose = "The best pair is not the outer pair."
distinguishes = ["moves_taller", "uses_taller_height", "width_plus_one"]

[[tests]]
key = "decreasing"
input = "L 5 9 7 5 3 1"
expected = "10"
probes = ["inner_pair_best"]
student_description = "Decreasing heights."
purpose = "Mirror of the increasing case."
distinguishes = ["moves_taller", "uses_taller_height", "width_plus_one"]

[[tests]]
key = "equal_heights"
input = "L 4 3 3 3 3"
expected = "9"
probes = ["width_counts", "shorter_limits"]
student_description = "Every line equal."
purpose = "Ties between the ends."
distinguishes = ["width_plus_one"]

[[tests]]
key = "large_sawtooth"
input = "R 100000 37 11 10000 0"
expected = "993709720"
probes = ["large_input", "width_counts"]
student_description = "A long, jagged skyline."
purpose = "Large input."
distinguishes = ["moves_taller", "uses_taller_height", "width_plus_one"]

[[tests]]
key = "large_blocks"
input = "R 100000 1 0 10000 1"
expected = "900000000"
probes = ["large_input", "inner_pair_best"]
student_description = "A long skyline of repeated ramps."
purpose = "Large input; the best pair is not the outer pair."
distinguishes = ["moves_taller", "uses_taller_height", "width_plus_one"]

[[error_models]]
key = "moves_taller"
file = "error_models/moves_taller.cpp"
skill = "pointer_movement"
description = "Moves the pointer at the taller line, discarding a line that could still form a larger container."
student_hint = "Which of the two lines limits every container that uses it? That is the one you can safely discard."
known_limitation = "Attribution not unique (L20): moving the taller line never finds a larger container than the outermost pair, so this model is output-identical on every valid input to a program that only measures the outermost pair (a misread specification). Diagnoses are reported as qualified and add no skill evidence (docs/content-design/container-water.md)."

[[error_models]]
key = "width_plus_one"
file = "error_models/width_plus_one.cpp"
skill = "range_inclusion"
description = "Counts the width as hi - lo + 1 (the number of lines) instead of the distance between them."
student_hint = "How wide is a container between positions 2 and 5? Count the gaps, not the lines."

[[error_models]]
key = "uses_taller_height"
file = "error_models/uses_taller_height.cpp"
skill = "output_contract"
description = "Uses the taller line as the water level instead of the shorter one."
student_hint = "Which of the two lines decides how high the water can rise before it spills?"

[[error_models]]
key = "stops_before_adjacent"
file = "error_models/stops_before_adjacent.cpp"
skill = "loop_bounds"
description = "Loops while lo + 1 < hi, so the last pair of neighbouring lines is never checked."
student_hint = "Does your loop check a pair of neighbouring lines? Try two tall lines next to each other."

# Declared skills that no error model can give negative evidence for (ADR-034).
[positive_only_skills]
pointer_movement = "Its only model, moves_taller, carries a known_limitation (L20, ADR-032 route), so this skill can only receive correct observations through rule C (L19). Recorded when this check was introduced (ADR-034)."
