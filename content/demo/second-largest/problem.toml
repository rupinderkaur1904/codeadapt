# DEMO CONTENT — public repository, therefore NOT secret (ADR-009).
# Design record: docs/content-design/second-largest.md (bank expansion batch A1, 2026-10-25).

slug = "second-largest"
title = "Second largest distinct value"
family = "arrays"
statement = "statement.md"
harness = "harness.cpp"
reference = "reference.cpp"
solution_file = "solution.cpp" # name the student's code is compiled under
interface = "int second_largest(const std::vector<int>& a);"
# Recommendable from 2026-10-26 (owner decision, option C of
# docs/reviews/2026-10-26/recommendability-review.md). Earlier content versions were not
# (CE1 decision E2); their snapshots keep that.
recommendable = true

[skills]
tie_resolution = "Handling equal values as the specification says: which of several equal candidates wins, and whether duplicates count separately."
output_contract = "Returning exactly what the specification asks for: an index or a value, a sentinel when there is no answer."
loop_bounds = "Visiting exactly the positions the task needs: a loop starts and ends at the right index and runs from the right end."
running_state = "Keeping a tracked value current on every step and after the loop: a runner-up, the current run, a carry, a running prefix sum."

[probes]
duplicate_max = ["tie_resolution"]
increasing = ["running_state"]
max_first = ["loop_bounds"]
answer_first = ["loop_bounds"]
no_second = ["output_contract"]
single = ["output_contract", "loop_bounds"]
large_input = ["running_state"]

[curriculum]
assumes = ["iterating over a std::vector", "tracking a running maximum"]
prerequisites = ["first-max-index"]

[[tests]]
key = "sample_mixed"
visibility = "sample"
input = "L 6 4 9 2 9 7 1"
expected = "7"
probes = ["duplicate_max"]
student_description = "The maximum appears twice."
purpose = "Visible typical case with a duplicated maximum."
distinguishes = ["counts_duplicates"]

[[tests]]
key = "sample_none"
visibility = "sample"
input = "L 3 5 5 5"
expected = "-1"
probes = ["no_second", "duplicate_max"]
student_description = "Every value equal."
purpose = "Visible case with no second distinct value."
distinguishes = ["counts_duplicates", "zero_when_none"]

[[tests]]
key = "increasing"
input = "L 5 1 3 5 7 9"
expected = "7"
probes = ["increasing"]
student_description = "Increasing values."
purpose = "Each new value is a new maximum; the old one must move to second."
distinguishes = ["no_demotion"]

[[tests]]
key = "decreasing"
input = "L 5 9 7 5 3 1"
expected = "7"
probes = ["max_first"]
student_description = "Decreasing values."
purpose = "The maximum is first; the answer is the second element."
distinguishes = ["skips_first"]

[[tests]]
key = "answer_first"
input = "L 4 8 2 10 3"
expected = "8"
probes = ["answer_first", "increasing"]
student_description = "The answer is the first element."
purpose = "The second largest value is at index 0."
distinguishes = ["no_demotion", "skips_first"]

[[tests]]
key = "max_first_dups"
input = "L 5 10 10 4 6 10"
expected = "6"
probes = ["max_first", "duplicate_max"]
student_description = "The maximum first and repeated."
purpose = "Repeated maximum including position 0."
distinguishes = ["counts_duplicates"]

[[tests]]
key = "answer_before_max"
input = "L 3 5 3 9"
expected = "5"
probes = ["answer_first", "increasing"]
student_description = "The answer comes before the maximum, with a smaller value between them."
purpose = "Added after the held-out evaluation (2026-10-25): separates no_demotion from a program that only looks after the maximum's position."
distinguishes = ["no_demotion", "skips_first"]

[[tests]]
key = "two_distinct"
input = "L 2 3 8"
expected = "3"
probes = ["increasing", "answer_first"]
student_description = "Two different values."
purpose = "Smallest case with an answer; answer first."
distinguishes = ["no_demotion", "skips_first"]

[[tests]]
key = "two_equal"
input = "L 2 6 6"
expected = "-1"
probes = ["no_second", "duplicate_max"]
student_description = "Two equal values."
purpose = "Smallest case without an answer."
distinguishes = ["counts_duplicates", "zero_when_none"]

[[tests]]
key = "single"
input = "L 1 4"
expected = "-1"
probes = ["single", "no_second"]
student_description = "One element."
purpose = "Minimal input; no answer."
distinguishes = ["zero_when_none"]

[[tests]]
key = "zero_is_answer"
input = "L 4 0 5 0 5"
expected = "0"
probes = ["answer_first", "duplicate_max"]
student_description = "The answer is zero."
purpose = "0 is a genuine answer, not a sentinel."
distinguishes = ["counts_duplicates"]

[[tests]]
key = "second_dups"
input = "L 6 2 7 7 9 1 9"
expected = "7"
probes = ["duplicate_max", "increasing"]
student_description = "Both top values repeated."
purpose = "Duplicates of the maximum and of the answer."
distinguishes = ["counts_duplicates", "no_demotion"]

[[tests]]
key = "large_increasing"
input = "R 100000 1 0 100000 0"
expected = "99998"
probes = ["large_input", "increasing"]
student_description = "A long increasing array."
purpose = "Large input; every value a new maximum."
distinguishes = ["no_demotion"]

[[tests]]
key = "large_periodic"
input = "R 100000 7 3 1000 5"
expected = "1003"
probes = ["large_input", "duplicate_max"]
student_description = "A long array with repeating values."
purpose = "Large input with many duplicates of the maximum."
distinguishes = ["counts_duplicates"]

[[error_models]]
key = "counts_duplicates"
file = "error_models/counts_duplicates.cpp"
skill = "tie_resolution"
description = "Lets a copy of the maximum become the second largest, so a repeated maximum is returned (also the output of sorting and taking the second element)."
student_hint = "If the largest value appears twice, is the second copy a 'second largest distinct value'?"

[[error_models]]
key = "no_demotion"
file = "error_models/no_demotion.cpp"
skill = "running_state"
description = "When a new maximum appears, the old maximum is not moved to second place."
student_hint = "When you find a new largest value, what should happen to the previous largest value?"

[[error_models]]
key = "skips_first"
file = "error_models/skips_first.cpp"
skill = "loop_bounds"
description = "The loop starts at index 1 without using a[0], so the first element is never considered."
student_hint = "Does your loop consider the first element of the array?"

[[error_models]]
key = "zero_when_none"
file = "error_models/zero_when_none.cpp"
skill = "output_contract"
description = "The second largest starts at 0, so 'no second value' is reported as 0 instead of -1."
student_hint = "What must you return when there is no second distinct value? Check the starting value of your answer."
