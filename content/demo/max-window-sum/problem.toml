# DEMO CONTENT — public repository, therefore NOT secret (ADR-009).
# Design record: docs/content-design/max-window-sum.md (bank expansion batch A3, 2026-10-25).

slug = "max-window-sum"
title = "Largest sum of k consecutive values"
family = "sliding-window"
statement = "statement.md"
harness = "harness.cpp"
reference = "reference.cpp"
solution_file = "solution.cpp" # name the student's code is compiled under
interface = "int max_window_sum(const std::vector<int>& a, int k);"
# Recommendable from 2026-10-26 (owner decision, option C of
# docs/reviews/2026-10-26/recommendability-review.md). Earlier content versions were not
# (CE1 decision E2); their snapshots keep that.
recommendable = true

[skills]
accumulator_init = "Initialising (and re-initialising) a running best, minimum, maximum, count or sum to the value the first real element requires."
loop_bounds = "Visiting exactly the positions the task needs: a loop starts and ends at the right index and runs from the right end."
window_maintenance = "Keeping a sliding window's state current: removing the element that leaves, and shrinking the window rather than restarting it."

[probes]
best_window_last = ["loop_bounds"]
all_negative = ["accumulator_init"]
leaving_element_matters = ["window_maintenance"]
k_equals_n = ["loop_bounds", "window_maintenance"]
k_one = ["window_maintenance"]
large_input = ["window_maintenance"]

[curriculum]
assumes = ["summing a range of a std::vector"]

[[tests]]
key = "sample_typical"
visibility = "sample"
input = "L 7 2 1 5 1 3 2 4 3"
expected = "9"
probes = ["leaving_element_matters"]
student_description = "A small array, windows of 3."
purpose = "Visible typical case."
distinguishes = ["never_subtracts", "subtracts_wrong_element"]

[[tests]]
key = "sample_negative"
visibility = "sample"
input = "L 5 -4 -2 -7 -1 -3 2"
expected = "-4"
probes = ["all_negative"]
student_description = "Every value negative."
purpose = "Visible case where every window sum is negative."
distinguishes = ["best_starts_zero", "misses_last_window", "never_subtracts", "subtracts_wrong_element"]

[[tests]]
key = "best_last"
input = "L 6 1 2 1 2 9 9 2"
expected = "18"
probes = ["best_window_last", "leaving_element_matters"]
student_description = "The best window is at the end."
purpose = "The answer is the last window."
distinguishes = ["misses_last_window", "never_subtracts", "subtracts_wrong_element"]

[[tests]]
key = "best_first"
input = "L 6 9 9 1 1 1 1 2"
expected = "18"
probes = ["leaving_element_matters"]
student_description = "The best window is at the start."
purpose = "The first window is the answer."
distinguishes = ["never_subtracts"]

[[tests]]
key = "k_equals_n"
input = "L 4 3 -1 4 1 4"
expected = "7"
probes = ["k_equals_n"]
student_description = "The window is the whole array."
purpose = "Only one window exists."
distinguishes = []

[[tests]]
key = "k_one"
input = "L 5 -3 8 -1 6 2 1"
expected = "8"
probes = ["k_one"]
student_description = "Windows of one element."
purpose = "The answer is the largest element."
distinguishes = ["never_subtracts", "subtracts_wrong_element"]

[[tests]]
key = "negative_k_one"
input = "L 4 -5 -2 -9 -4 1"
expected = "-2"
probes = ["k_one", "all_negative"]
student_description = "Negative values, windows of one."
purpose = "All negative with k = 1."
distinguishes = ["best_starts_zero", "never_subtracts", "subtracts_wrong_element"]

[[tests]]
key = "mixed_signs"
input = "L 8 4 -6 3 3 -2 5 -8 1 3"
expected = "6"
probes = ["leaving_element_matters", "best_window_last"]
student_description = "Positive and negative values."
purpose = "Large positives early must leave the window."
distinguishes = ["never_subtracts", "subtracts_wrong_element"]

[[tests]]
key = "dip_then_rise"
input = "L 7 5 5 -9 -9 1 6 6 2"
expected = "12"
probes = ["best_window_last", "leaving_element_matters"]
student_description = "A dip in the middle, rising at the end."
purpose = "Two windows compete; the later one wins."
distinguishes = ["misses_last_window", "never_subtracts", "subtracts_wrong_element"]

[[tests]]
key = "single"
input = "L 1 -7 1"
expected = "-7"
probes = ["k_equals_n", "all_negative"]
student_description = "One element."
purpose = "Minimal input."
distinguishes = ["best_starts_zero"]

[[tests]]
key = "large_negative"
input = "R 100000 7 3 1000 -5000 50"
expected = "-208625"
probes = ["large_input", "all_negative"]
student_description = "A long array of negative values."
purpose = "Large input; every window negative."
distinguishes = ["best_starts_zero", "never_subtracts", "subtracts_wrong_element"]

[[tests]]
key = "large_ramp"
input = "R 100000 1 0 10000 -5000 100"
expected = "494950"
probes = ["large_input", "best_window_last"]
student_description = "A long array of repeated ramps."
purpose = "Large input."
distinguishes = ["never_subtracts", "subtracts_wrong_element"]

[[error_models]]
key = "best_starts_zero"
file = "error_models/best_starts_zero.cpp"
skill = "accumulator_init"
description = "Starts the best sum at 0, so 0 is returned when every window sum is negative."
student_hint = "What should you return if every window has a negative sum? Check the starting value of your best sum."

[[error_models]]
key = "misses_last_window"
file = "error_models/misses_last_window.cpp"
skill = "loop_bounds"
description = "The sliding loop stops one step early, so the last window is never summed."
student_hint = "Does your loop reach the window that ends at the last element?"

[[error_models]]
key = "never_subtracts"
file = "error_models/never_subtracts.cpp"
skill = "window_maintenance"
description = "Adds each entering element but never subtracts the leaving one, so the window keeps growing."
student_hint = "When the window moves one step right, which element leaves it?"

[[error_models]]
key = "subtracts_wrong_element"
file = "error_models/subtracts_wrong_element.cpp"
skill = "window_maintenance"
description = "Subtracts a[i - k + 1] instead of a[i - k], so the wrong element leaves the window."
student_hint = "When element i enters a window of size k, which index leaves? Check it on a small example."
