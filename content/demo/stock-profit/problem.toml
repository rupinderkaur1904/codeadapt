# DEMO CONTENT — public repository, therefore NOT secret (ADR-009).
# Design record: docs/content-design/stock-profit.md (bank expansion batch A1, 2026-10-25).

slug = "stock-profit"
title = "Best single trade"
family = "arrays"
statement = "statement.md"
harness = "harness.cpp"
reference = "reference.cpp"
solution_file = "solution.cpp" # name the student's code is compiled under
interface = "int max_profit(const std::vector<int>& prices);"
# Bank expansion (2026-10-25): new problems are not recommendable (CE1 decision E2 applied to
# every new problem). They stay in the problem list and their attempts produce skill evidence.
recommendable = false

[skills]
index_range = "Visiting exactly the valid positions: the loop's start and end cover every element once."
output_contract = "Returning exactly what the specification asks for: an index or a value, a sentinel when there is no answer."

[probes]
min_after_max = ["output_contract"]
best_sale_last = ["index_range"]
falling = ["output_contract"]
single_day = ["output_contract"]
large_input = ["index_range"]

[curriculum]
assumes = ["tracking a running minimum while scanning"]
prerequisites = ["first-max-index"]

[[tests]]
key = "sample_typical"
visibility = "sample"
input = "L 6 7 1 5 3 6 4"
expected = "5"
probes = ["best_sale_last"]
student_description = "A typical week of prices."
purpose = "Visible typical case."
distinguishes = ["ignores_order"]

[[tests]]
key = "sample_falling"
visibility = "sample"
input = "L 5 7 6 4 3 1"
expected = "0"
probes = ["falling", "min_after_max"]
student_description = "Prices only fall."
purpose = "Visible case with no profitable trade."
distinguishes = ["allows_loss", "ignores_order"]

[[tests]]
key = "rise_last_day"
input = "L 5 3 4 2 5 9"
expected = "7"
probes = ["best_sale_last"]
student_description = "The best sale is on the last day."
purpose = "The answer needs the last day."
distinguishes = ["misses_last_day"]

[[tests]]
key = "peak_then_dip"
input = "L 6 2 9 4 8 1 3"
expected = "7"
probes = ["min_after_max"]
student_description = "A high price early, the lowest price late."
purpose = "The global minimum comes after the global maximum."
distinguishes = ["ignores_order"]

[[tests]]
key = "min_after_max_flat"
input = "L 4 5 8 6 1"
expected = "3"
probes = ["min_after_max"]
student_description = "Rise, then a deep fall."
purpose = "Global spread is not achievable."
distinguishes = ["ignores_order"]

[[tests]]
key = "flat"
input = "L 4 5 5 5 5"
expected = "0"
probes = ["falling"]
student_description = "Constant prices."
purpose = "Zero profit without a loss."
distinguishes = []

[[tests]]
key = "single_day"
input = "L 1 4"
expected = "0"
probes = ["single_day"]
student_description = "One day only."
purpose = "Minimal input: no trade possible."
distinguishes = ["allows_loss"]

[[tests]]
key = "two_days_up"
input = "L 2 1 10"
expected = "9"
probes = ["best_sale_last"]
student_description = "Two days, rising."
purpose = "Smallest profitable case; sale on the last day."
distinguishes = ["misses_last_day"]

[[tests]]
key = "two_days_down"
input = "L 2 10 1"
expected = "0"
probes = ["falling", "min_after_max"]
student_description = "Two days, falling."
purpose = "Smallest losing case."
distinguishes = ["allows_loss", "ignores_order"]

[[tests]]
key = "late_low_late_high"
input = "L 7 8 6 9 2 3 7 1"
expected = "5"
probes = ["min_after_max"]
student_description = "Several rises and falls."
purpose = "The best trade is in the middle; the last day is the lowest."
distinguishes = ["ignores_order"]

[[tests]]
key = "large_rising"
input = "R 10000 1 0 10000 1"
expected = "9999"
probes = ["large_input", "best_sale_last"]
student_description = "A long rising market."
purpose = "Large input; best sale on the last day."
distinguishes = ["misses_last_day"]

[[tests]]
key = "dip_then_last_rise"
input = "L 5 9 3 5 2 8"
expected = "6"
probes = ["best_sale_last", "min_after_max"]
student_description = "An early high, a late low, then a rise on the last day."
purpose = "The best sale is last and the global spread is not achievable."
distinguishes = ["ignores_order", "misses_last_day"]

[[tests]]
key = "large_sawtooth"
input = "R 100000 37 5 10000 1"
expected = "9999"
probes = ["large_input", "min_after_max"]
student_description = "A long market that rises and falls repeatedly."
purpose = "Large input with many local trades."
distinguishes = []

[[error_models]]
key = "ignores_order"
file = "error_models/ignores_order.cpp"
skill = "output_contract"
description = "Returns the overall maximum minus the overall minimum, ignoring that the purchase must come before the sale (sorting the prices gives the same output)."
student_hint = "Can you sell on a day before the day you buy? Try prices whose lowest value comes after their highest."
known_limitation = "Attribution not unique (L20): sorting the prices (a misread specification) and tracking the overall minimum and maximum separately (an update error) give identical output on every valid input. Diagnoses are reported as qualified and add no skill evidence (design record docs/content-design/stock-profit.md)."

[[error_models]]
key = "allows_loss"
file = "error_models/allows_loss.cpp"
skill = "output_contract"
description = "Insists on one trade, so a falling market gives a negative profit (and a single day gives INT_MIN) instead of 0."
student_hint = "What should you return when no trade makes money? Check the starting value of your answer."

[[error_models]]
key = "misses_last_day"
file = "error_models/misses_last_day.cpp"
skill = "index_range"
description = "The loop stops one day early, so selling on the last day is never considered."
student_hint = "Does your loop consider selling on the very last day?"
