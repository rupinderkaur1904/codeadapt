# DEMO CONTENT — public repository, therefore NOT secret (ADR-009).
# Design record: docs/content-design/integer-sqrt.md (CE1.2, gap G2).

slug = "integer-sqrt"
title = "Integer square root"
family = "binary-search"
statement = "statement.md"
harness = "harness.cpp"
reference = "reference.cpp"
solution_file = "solution.cpp" # name the student's code is compiled under
interface = "int int_sqrt(int x);"
# Library calls the statement forbids (D1, ADR-035): an attempt naming one gives no skill
# observations. Must match the statement's "Do not call" sentence.
banned_names = ["cbrt", "hypot", "pow", "sqrt", "sqrtf", "sqrtl"]
# CE1 decision E2: recommendation policy v1 never chooses this problem as a follow-up. It
# stays in the problem list and its attempts are diagnosed and produce skill evidence.
recommendable = false

[skills]
search_space_boundaries = "Initialising and updating the bounds of the search space so every candidate answer stays reachable."
loop_termination = "Ensuring each iteration shrinks the search space so the loop terminates."
equality_handling = "Choosing the comparison so equal elements land on the correct side of the boundary."
problem_specification = "Returning what the specification asks for, including when the target is absent."

# A probe is a property of an input that a test exercises. Each probe names the skills
# whose errors it can expose; this mapping is a modelling assumption, not a fact.
[probes]
zero_input = ["search_space_boundaries"]
one_input = ["search_space_boundaries", "loop_termination"]
perfect_square = ["equality_handling"]
non_square = ["problem_specification"]
small_value = ["loop_termination"]
large_value = ["loop_termination"]
top_of_range = ["search_space_boundaries"]

# Links to other problems by slug (docs/content-design/README.md section 1.6). Reverse links
# are not added: they would change existing content versions.
[curriculum]
assumes = ["long long arithmetic", "integer overflow"]
prerequisites = ["first-true", "lower-bound"]

[[tests]]
key = "zero"
input = "0"
expected = "0"
probes = ["zero_input", "small_value"]
student_description = "The input is 0."
purpose = "Smallest input: the answer 0 is the bottom of the range."
distinguishes = ["hi_excludes_x", "returns_lo_closed"]

[[tests]]
key = "one"
input = "1"
expected = "1"
probes = ["one_input", "small_value"]
student_description = "The input is 1."
purpose = "Smallest perfect square, and the smallest range where the last candidate must still be checked."
distinguishes = ["closed_loop_lt", "floor_mid_no_progress", "hi_excludes_x", "returns_lo_closed", "strict_square_test"]

[[tests]]
key = "two"
input = "2"
expected = "1"
probes = ["non_square", "small_value"]
student_description = "A small input that is not a perfect square."
purpose = "Small non-square."
distinguishes = ["floor_mid_no_progress", "returns_ceiling", "returns_lo_closed"]

[[tests]]
key = "three"
input = "3"
expected = "1"
probes = ["non_square", "small_value"]
student_description = "A small input just below a perfect square."
purpose = "Small non-square just below 4."
distinguishes = ["returns_ceiling", "returns_lo_closed"]

[[tests]]
key = "four"
input = "4"
expected = "2"
probes = ["perfect_square", "small_value"]
student_description = "A small perfect square."
purpose = "Small perfect square: the answer's square equals x."
distinguishes = ["returns_lo_closed", "strict_square_test"]

[[tests]]
key = "eight"
visibility = "sample"
input = "8"
expected = "2"
probes = ["non_square", "small_value"]
student_description = "A small input that is not a perfect square."
purpose = "Visible non-square; the first check most code meets."
distinguishes = ["floor_mid_no_progress", "returns_ceiling", "returns_lo_closed"]

[[tests]]
key = "nine"
input = "9"
expected = "3"
probes = ["perfect_square", "small_value"]
student_description = "A small perfect square."
purpose = "Small perfect square."
distinguishes = ["closed_loop_lt", "floor_mid_no_progress", "returns_lo_closed", "strict_square_test"]

[[tests]]
key = "ten"
input = "10"
expected = "3"
probes = ["non_square", "small_value"]
student_description = "A small input just above a perfect square."
purpose = "Small non-square just above 9."
distinguishes = ["floor_mid_no_progress", "returns_ceiling", "returns_lo_closed"]

[[tests]]
key = "fifteen"
input = "15"
expected = "3"
probes = ["non_square", "small_value"]
student_description = "An input just below a perfect square."
purpose = "Non-square just below 16."
distinguishes = ["returns_ceiling", "returns_lo_closed"]

[[tests]]
key = "sixteen"
visibility = "sample"
input = "16"
expected = "4"
probes = ["perfect_square", "small_value"]
student_description = "A perfect square."
purpose = "Visible perfect square."
distinguishes = ["closed_loop_lt", "floor_mid_no_progress", "returns_lo_closed", "strict_square_test"]

[[tests]]
key = "ninety_nine"
input = "99"
expected = "9"
probes = ["non_square"]
student_description = "An input just below a perfect square."
purpose = "Non-square just below 100."
distinguishes = ["floor_mid_no_progress", "returns_ceiling", "returns_lo_closed"]

[[tests]]
key = "hundred"
input = "100"
expected = "10"
probes = ["perfect_square"]
student_description = "A perfect square."
purpose = "Perfect square 100."
distinguishes = ["closed_loop_lt", "floor_mid_no_progress", "returns_lo_closed", "strict_square_test"]

[[tests]]
key = "million"
input = "1000000"
expected = "1000"
probes = ["perfect_square", "large_value"]
student_description = "A large perfect square."
purpose = "10^6: a fixed iteration count starts failing here."
distinguishes = ["closed_loop_lt", "fixed_iterations_16", "floor_mid_no_progress", "returns_lo_closed", "strict_square_test"]

[[tests]]
key = "million_minus_one"
input = "999999"
expected = "999"
probes = ["non_square"]
student_description = "A large input just below a perfect square."
purpose = "10^6 - 1: large non-square."
distinguishes = ["fixed_iterations_16", "floor_mid_no_progress", "returns_ceiling", "returns_lo_closed"]

[[tests]]
key = "big_non_square"
input = "123456789"
expected = "11111"
probes = ["non_square", "large_value"]
student_description = "A large input that is not a perfect square."
purpose = "Large interior answer (11111)."
distinguishes = ["closed_loop_lt", "fixed_iterations_16", "floor_mid_no_progress", "returns_ceiling", "returns_lo_closed"]

[[tests]]
key = "square_46339"
input = "2147302921"
expected = "46339"
probes = ["perfect_square", "large_value"]
student_description = "A very large perfect square."
purpose = "46339^2: the largest square below the top answer."
distinguishes = ["closed_loop_lt", "fixed_iterations_16", "returns_lo_closed", "strict_square_test"]

[[tests]]
key = "below_top_square"
input = "2147395599"
expected = "46339"
probes = ["non_square", "large_value"]
student_description = "The largest input whose answer is 46339."
purpose = "46340^2 - 1."
distinguishes = ["closed_loop_lt", "fixed_iterations_16", "floor_mid_no_progress", "returns_ceiling", "returns_lo_closed"]

[[tests]]
key = "top_square"
input = "2147395600"
expected = "46340"
probes = ["perfect_square", "large_value", "top_of_range"]
student_description = "The largest perfect square in range."
purpose = "46340^2: the top answer, reached exactly."
distinguishes = ["fixed_iterations_16", "floor_mid_no_progress", "hi_cap_46340", "returns_lo_closed", "strict_square_test"]

[[tests]]
key = "int_max"
input = "2147483647"
expected = "46340"
probes = ["non_square", "large_value", "top_of_range"]
student_description = "The largest allowed input."
purpose = "2^31 - 1: the top answer on a non-square."
distinguishes = ["closed_loop_lt", "fixed_iterations_16", "floor_mid_no_progress", "hi_cap_46340", "returns_ceiling", "returns_lo_closed"]

[[error_models]]
key = "strict_square_test"
file = "error_models/strict_square_test.cpp"
skill = "equality_handling"
description = "Accepts mid only when mid * mid < x, so a perfect square's own root is rejected: r - 1 on every perfect square >= 1."
student_hint = "When mid * mid equals x exactly, is mid a valid answer?"
known_limitation = "Attribution not unique (owner approval 2026-10-26, L20 safeguard S1): a correct search for the largest r with r * r < x, or for the floor square root of x - 1 (misread tasks), gives identical output on every committed test and on every input of the exhaustive and random search domains, so no test can separate an equality error from a specification error. Diagnoses are reported as qualified and add no equality_handling evidence (docs/reviews/2026-10-25/l20-search.md, case 12)."

[[error_models]]
key = "closed_loop_lt"
file = "error_models/closed_loop_lt.cpp"
skill = "loop_termination"
description = "Closed interval with a running answer, but loops while lo < hi, so the last remaining candidate is never checked; terminates with a too-small answer."
student_hint = "Check when your loop stops: is there still a candidate left that you have not tested?"

[[error_models]]
key = "fixed_iterations_16"
file = "error_models/fixed_iterations_16.cpp"
skill = "loop_termination"
description = "Runs at most 16 iterations although the range is [0, x], so the search stops early for large x; terminates with a too-small answer."
student_hint = "How many halvings does a range of size x need? Make the loop run until the range is empty, not a fixed number of times."

[[error_models]]
key = "floor_mid_no_progress"
file = "error_models/floor_mid_no_progress.cpp"
skill = "loop_termination"
description = "Last-true form with lo = mid and a floor midpoint, so the range stops shrinking once hi == lo + 1."
student_hint = "When only two candidates remain, does every iteration still shrink the range?"

[[error_models]]
key = "hi_excludes_x"
file = "error_models/hi_excludes_x.cpp"
skill = "search_space_boundaries"
description = "Half-open search for the first r with r * r > x, minus one, with hi = x instead of x + 1: wrong only for x = 0 and x = 1."
student_hint = "Check the initial bounds: can every possible answer, including the smallest inputs, still be reached?"

[[error_models]]
key = "hi_cap_46340"
file = "error_models/hi_cap_46340.cpp"
skill = "search_space_boundaries"
description = "Half-open search with the range capped at 46340 instead of 46341, so the top answer 46340 is unreachable."
student_hint = "Check the top of your search range: can the largest possible answer still be found?"

[[error_models]]
key = "returns_ceiling"
file = "error_models/returns_ceiling.cpp"
skill = "problem_specification"
description = "Returns the smallest r with r * r >= x (the ceiling), one too large on every non-square."
student_hint = "Re-read what to return when x is not a perfect square: the largest r with r * r <= x."

[[error_models]]
key = "returns_lo_closed"
file = "error_models/returns_lo_closed.cpp"
skill = "problem_specification"
description = "Closed interval with no running answer, returning lo, which ends one past the answer on every input."
student_hint = "When your loop ends, which variable holds the largest r with r * r <= x?"

# Declared skills that no error model can give negative evidence for (ADR-034).
[positive_only_skills]
equality_handling = "Every model mapped to it carries a known_limitation after L20 safeguard S1 (owner approval 2026-10-26), so this skill can only receive correct observations through rule C (L19). The mapping itself was not changed."
