# DEMO CONTENT — public repository, therefore NOT secret (ADR-009).
# Real study problems live in a private content repository.

slug = "lower-bound"
title = "Lower bound"
family = "binary-search"
statement = "statement.md"
harness = "harness.cpp"
reference = "reference.cpp"
solution_file = "solution.cpp" # name the student's code is compiled under
interface = "int lower_bound_index(const std::vector<int>& a, int target);"

[skills]
search_space_boundaries = "Initialising and updating the bounds of the search space so every candidate answer stays reachable."
loop_termination = "Ensuring each iteration shrinks the search space so the loop terminates."
equality_handling = "Choosing the comparison so equal elements land on the correct side of the boundary."
problem_specification = "Returning what the specification asks for, including when the target is absent."

# A probe is a property of an input that a test exercises. Each probe names the skills
# whose errors it can expose; this mapping is a modelling assumption, not a fact.
[probes]
empty_input = ["search_space_boundaries"]
target_below_all = ["search_space_boundaries"]
target_above_all = ["search_space_boundaries", "problem_specification"]
target_present_unique = ["equality_handling"]
target_present_duplicates = ["equality_handling"]
target_absent_between = ["problem_specification"]
single_element = ["search_space_boundaries", "loop_termination"]
two_elements = ["loop_termination"]
large_input = ["loop_termination"]

# Links to other problems by slug (docs/content-design/README.md section 1.6).
[curriculum]
assumes = ["indexing a sorted std::vector", "a loop invariant over a half-open range [lo, hi)"]
equivalents = ["count-occurrences", "last-less-than"]

[[tests]]
key = "sample_present"
visibility = "sample"
input = "L 4 1 3 5 7 5"
expected = "2"
probes = ["target_present_unique"]
student_description = "The target appears once in the array."
purpose = "Visible unique-target case; the first check most code meets."
distinguishes = ["closed_loop_hi_mid", "hi_skips_candidate", "no_progress_update", "returns_wrong_pointer", "upper_bound_confusion"]

[[tests]]
key = "sample_absent"
visibility = "sample"
input = "L 4 1 3 5 7 4"
expected = "2"
probes = ["target_absent_between"]
student_description = "The target is absent and falls between two elements."
purpose = "Visible absent-target case."
distinguishes = ["closed_loop_hi_mid", "exact_match_sentinel", "hi_skips_candidate", "no_progress_update", "returns_wrong_pointer"]

[[tests]]
key = "empty"
input = "L 0 3"
expected = "0"
probes = ["empty_input"]
student_description = "The array is empty."
purpose = "Minimal input (n = 0); where code reading past the end faults."
distinguishes = ["exact_match_sentinel", "returns_wrong_pointer"]

[[tests]]
key = "below_all"
input = "L 3 2 4 6 1"
expected = "0"
probes = ["target_below_all"]
student_description = "The target is smaller than every element."
purpose = "Answer 0 with the target absent."
distinguishes = ["closed_loop_hi_mid", "exact_match_sentinel", "returns_wrong_pointer"]

[[tests]]
key = "above_all"
input = "L 3 2 4 6 9"
expected = "3"
probes = ["target_above_all"]
student_description = "The target is larger than every element."
purpose = "Answer n: is the end position reachable?"
distinguishes = ["exact_match_sentinel", "hi_init_last_index", "no_progress_update", "returns_wrong_pointer"]

[[tests]]
key = "equal_first"
input = "L 3 2 4 6 2"
expected = "0"
probes = ["target_present_unique"]
student_description = "The target equals the first element."
purpose = "Target at index 0; separates upper_bound_confusion from no_progress_update."
distinguishes = ["closed_loop_hi_mid", "returns_wrong_pointer", "upper_bound_confusion"]

[[tests]]
key = "equal_last"
input = "L 3 2 4 6 6"
expected = "2"
probes = ["target_present_unique"]
student_description = "The target equals the last element."
purpose = "Target at the last index; equality at the other end."
distinguishes = ["closed_loop_hi_mid", "no_progress_update", "returns_wrong_pointer", "upper_bound_confusion"]

[[tests]]
key = "duplicates_middle"
input = "L 6 1 2 2 2 2 3 2"
expected = "1"
probes = ["target_present_duplicates"]
student_description = "The target appears several times in a row."
purpose = "Run of equal targets in the middle; main small-input evidence for stops_at_first_match."
distinguishes = ["closed_loop_hi_mid", "exact_match_sentinel", "hi_skips_candidate", "no_progress_update", "returns_wrong_pointer", "stops_at_first_match", "upper_bound_confusion"]

[[tests]]
key = "duplicates_all"
input = "D 7 5 5"
expected = "0"
probes = ["target_present_duplicates"]
student_description = "Every element equals the target."
purpose = "Every element equals the target; second behaviour group for stops_at_first_match."
distinguishes = ["closed_loop_hi_mid", "exact_match_sentinel", "returns_wrong_pointer", "stops_at_first_match", "upper_bound_confusion"]

[[tests]]
key = "single_equal"
input = "L 1 4 4"
expected = "0"
probes = ["single_element", "target_present_unique"]
student_description = "A one-element array containing the target."
purpose = "Smallest equality case (n = 1)."
distinguishes = ["closed_loop_hi_mid", "returns_wrong_pointer", "upper_bound_confusion"]

[[tests]]
key = "single_above"
input = "L 1 4 7"
expected = "1"
probes = ["single_element", "target_above_all"]
student_description = "A one-element array whose element is smaller than the target."
purpose = "Smallest case whose answer is n."
distinguishes = ["exact_match_sentinel", "hi_init_last_index", "no_progress_update", "returns_wrong_pointer"]

[[tests]]
key = "two_between"
input = "L 2 1 9 5"
expected = "1"
probes = ["two_elements", "target_absent_between"]
student_description = "A two-element array with the target between the elements."
purpose = "Smallest input on which a non-shrinking update loops."
distinguishes = ["closed_loop_hi_mid", "exact_match_sentinel", "hi_skips_candidate", "no_progress_update", "returns_wrong_pointer"]

[[tests]]
key = "large_absent"
input = "A 200000 0 2 99999"
expected = "50000"
probes = ["large_input", "target_absent_between"]
student_description = "A large array where the target is absent."
purpose = "Scale version of two_between. Does not test the O(log n) requirement."
distinguishes = ["closed_loop_hi_mid", "exact_match_sentinel", "no_progress_update", "returns_wrong_pointer"]

[[tests]]
key = "large_above_all"
input = "A 200000 0 2 1000000000"
expected = "200000"
probes = ["large_input", "target_above_all"]
student_description = "A large array where the target is larger than every element."
purpose = "Scale version of above_all. Does not test the O(log n) requirement."
distinguishes = ["exact_match_sentinel", "hi_init_last_index", "no_progress_update", "returns_wrong_pointer"]

[[tests]]
key = "large_duplicates"
input = "D 200000 7 7"
expected = "0"
probes = ["large_input", "target_present_duplicates"]
student_description = "A large array in which every element equals the target."
purpose = "Scale version of duplicates_all. Does not test the O(log n) requirement."
distinguishes = ["closed_loop_hi_mid", "exact_match_sentinel", "returns_wrong_pointer", "stops_at_first_match", "upper_bound_confusion"]

[[tests]]
key = "pair_equal_target"
input = "L 2 5 5 5"
expected = "0"
probes = ["target_present_duplicates", "two_elements"]
student_description = "A two-element array whose elements both equal the target."
purpose = "Smallest input with a repeated target; small-input evidence for stops_at_first_match beside the scale test."
distinguishes = ["closed_loop_hi_mid", "returns_wrong_pointer", "stops_at_first_match", "upper_bound_confusion"]

[[tests]]
key = "absent_after_duplicates"
input = "L 6 1 2 2 4 4 5 3"
expected = "3"
probes = ["target_absent_between"]
student_description = "The target is absent and falls just after a run of repeated values."
purpose = "Absent target right of a run; evidence for hi_skips_candidate outside the middle cases."
distinguishes = ["closed_loop_hi_mid", "exact_match_sentinel", "hi_skips_candidate", "no_progress_update", "returns_wrong_pointer"]

[[error_models]]
key = "upper_bound_confusion"
file = "error_models/upper_bound_confusion.cpp"
skill = "equality_handling"
description = "Uses a[mid] <= target where a[mid] < target is required, so the search returns the first element strictly greater than the target (upper bound)."
student_hint = "Check which side of the boundary elements equal to the target end up on."

[[error_models]]
key = "hi_init_last_index"
file = "error_models/hi_init_last_index.cpp"
skill = "search_space_boundaries"
description = "Initialises hi = n - 1 with a half-open loop, so the answer n (no element >= target) is unreachable."
student_hint = "Can your search ever return a.size()? Check the initial bounds of the search space."
known_limitation = "Detected only by tests whose answer is n (one behaviour group). Any error that cannot return n, such as clamping the result to n - 1, produces identical outputs, so diagnoses are reported as qualified (docs/content-design/lower-bound.md section 4.3)."

[[error_models]]
key = "no_progress_update"
file = "error_models/no_progress_update.cpp"
skill = "loop_termination"
description = "Updates lo = mid instead of lo = mid + 1; when two candidates remain the search space stops shrinking and the loop does not terminate."
student_hint = "Make sure every iteration of your loop strictly shrinks the search range."

[[error_models]]
key = "exact_match_sentinel"
file = "error_models/exact_match_sentinel.cpp"
skill = "problem_specification"
description = "Implements exact-match search: returns some index holding the target, or -1 when the target is absent."
student_hint = "Re-read what should be returned when the target is not in the array."

[[error_models]]
key = "stops_at_first_match"
file = "error_models/stops_at_first_match.cpp"
skill = "equality_handling"
description = "Returns as soon as a[mid] == target, which is not necessarily the first occurrence when values repeat."
student_hint = "If the target appears several times, which occurrence should be returned?"

[[error_models]]
key = "hi_skips_candidate"
file = "error_models/hi_skips_candidate.cpp"
skill = "search_space_boundaries"
description = "Half-open loop that sets hi = mid - 1 when a[mid] >= target, discarding a[mid], which may itself be the answer."
student_hint = "When a[mid] could itself be the answer, does your update keep it in the search range?"

[[error_models]]
key = "closed_loop_hi_mid"
file = "error_models/closed_loop_hi_mid.cpp"
skill = "loop_termination"
description = "Closed-interval loop (lo <= hi, hi = n - 1) with the half-open update hi = mid; once lo == hi and a[mid] >= target the range stops shrinking and the loop does not terminate."
student_hint = "Check that your loop condition and your updates describe the same kind of interval, so every iteration shrinks the range."

[[error_models]]
key = "returns_wrong_pointer"
file = "error_models/returns_wrong_pointer.cpp"
skill = "problem_specification"
description = "Correct closed-interval search that returns hi instead of lo; on exit hi == lo - 1, the last index whose element is below the target."
student_hint = "When your loop ends, which of your two indices holds the position the specification asks for?"
