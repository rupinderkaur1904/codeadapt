# Held-out synthetic evaluation cases (ADR-008: data_class = synthetic).
# `truth` is an error model key of the problem, "correct", or "unmodelled".
# These were written separately from the error models but by the same author;
# see docs/methodology.md §6.1 for what that does and does not allow us to claim.

problem = "lower-bound"

[[cases]]
file = "upper_bound_closed.cpp"
truth = "upper_bound_confusion"
note = "Closed-interval loop using <= (written independently of the error model)."

[[cases]]
file = "recursive_last_index.cpp"
truth = "hi_init_last_index"
note = "Recursive search started at the last index."

[[cases]]
file = "classic_exact_search.cpp"
truth = "exact_match_sentinel"
note = "Textbook exact-match search returning -1."

[[cases]]
file = "correct_iterative.cpp"
truth = "correct"
note = "Different correct algorithm."

[[cases]]
file = "closed_interval_correct.cpp"
truth = "correct"
note = "Correct closed-interval search with an answer variable."

[[cases]]
file = "double_bug.cpp"
truth = "unmodelled"
note = "Two modelled bugs at once."

[[cases]]
file = "empty_returns_minus_one.cpp"
truth = "unmodelled"
note = "Special-cases empty input wrongly; no error model describes it."
