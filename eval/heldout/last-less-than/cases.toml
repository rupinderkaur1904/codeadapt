# Held-out synthetic evaluation cases (ADR-008: data_class = synthetic).
# `truth` is an error model key of the problem, "correct", or "unmodelled".
# These were written separately from the error models but by the same author;
# see docs/methodology.md §6.1 for what that does and does not allow us to claim.

problem = "last-less-than"

[[cases]]
file = "closed_interval_le.cpp"
truth = "uses_le"
note = "Closed interval accepting equal elements."

[[cases]]
file = "returns_count_below.cpp"
truth = "returns_insertion_point"
note = "Width-halving search returning the count below the target."

[[cases]]
file = "never_negative.cpp"
truth = "clamps_to_zero"
note = "Reports not-found as index 0."

[[cases]]
file = "closed_interval_correct.cpp"
truth = "correct"
note = "Correct closed-interval search."

[[cases]]
file = "le_and_clamped.cpp"
truth = "unmodelled"
note = "Two modelled bugs at once."

# Added 2026-10-17 (CE1.0) for models without a held-out case. Written and committed before
# the method was run on them, by the models' author in a different style.

[[cases]]
file = "closed_from_last_index.cpp"
truth = "hi_init_last_index"
note = "Upper edge starts at n - 1, so the answer n - 1 is unreachable."

[[cases]]
file = "while_true_stalls.cpp"
truth = "no_progress_update"
note = "while (true) with an early return; the left edge moves to the midpoint only."
