# Held-out synthetic evaluation cases (ADR-008: data_class = synthetic).
# `truth` is an error model key of the problem, "correct", or "unmodelled".
# Written for the bank expansion (batch A2, 2026-10-25) by the models' author, in styles
# different from the models, and committed before the method was run on them. See
# docs/methodology.md §6.1 for what that does and does not allow us to claim.

problem = "plus-one"

[[cases]]
file = "carry_variable.cpp"
truth = "correct"
note = "Carry variable with % and / that stops when the carry is spent."

[[cases]]
file = "build_reversed.cpp"
truth = "correct"
note = "Works on a reversed copy and reverses back."

[[cases]]
file = "one_carry_only.cpp"
truth = "single_carry"
note = "Handles one carry into the second-last digit only."

[[cases]]
file = "lost_leading_one.cpp"
truth = "no_new_digit"
note = "Full carry loop that drops the final carry."

[[cases]]
file = "front_to_back.cpp"
truth = "adds_at_front"
note = "Carry loop running from the first digit."

[[cases]]
file = "sticky_carry.cpp"
truth = "carry_never_cleared"
note = "Adds 1 to every digit modulo 10."

[[cases]]
file = "no_carry_at_all.cpp"
truth = "unmodelled"
note = "No carry: a 9 becomes 10."

[[cases]]
file = "via_long_long.cpp"
truth = "unmodelled"
note = "Converts to a 64-bit integer, which overflows on long inputs."
