<!doctype html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#fff;font-family:Helvetica,Arial,sans-serif} #g{position:relative;overflow:hidden;background:#fff}</style>
<script>var mxBasePath='mx/package/javascript/src', mxLoadResources=false, mxLoadStylesheet=false, mxImageBasePath='mx/package/javascript/src/images';</script>
<script src="mx/package/javascript/mxClient.js"></script>
</head><body><div id="g"></div>
<script>
function ActorShape(){ mxShape.call(this); } mxUtils.extend(ActorShape, mxShape);
ActorShape.prototype.paintVertexShape=function(c,x,y,w,h){
  c.ellipse(x+w/4,y,w/2,h/4); c.fillAndStroke();
  c.begin(); c.moveTo(x+w/2,y+h/4); c.lineTo(x+w/2,y+2*h/3);
  c.moveTo(x+w/2,y+h/3); c.lineTo(x,y+h/3); c.moveTo(x+w/2,y+h/3); c.lineTo(x+w,y+h/3);
  c.moveTo(x+w/2,y+2*h/3); c.lineTo(x,y+h); c.moveTo(x+w/2,y+2*h/3); c.lineTo(x+w,y+h); c.end(); c.stroke(); };
mxCellRenderer.registerShape('umlActor', ActorShape);
function FrameShape(){ mxShape.call(this); } mxUtils.extend(FrameShape, mxShape);
FrameShape.prototype.paintVertexShape=function(c,x,y,w,h){
  var tw=parseFloat(mxUtils.getValue(this.style,'width',60)), th=parseFloat(mxUtils.getValue(this.style,'height',22));
  c.rect(x,y,w,h); c.stroke();
  c.begin(); c.moveTo(x,y); c.lineTo(x+tw,y); c.lineTo(x+tw,y+th*0.6); c.lineTo(x+tw-8,y+th); c.lineTo(x,y+th); c.close(); c.setFillColor('#FFFFFF'); c.fillAndStroke(); };
mxCellRenderer.registerShape('umlFrame', FrameShape);
function NoteShape(){ mxShape.call(this); } mxUtils.extend(NoteShape, mxShape);
NoteShape.prototype.paintVertexShape=function(c,x,y,w,h){ var s=10;
  c.begin(); c.moveTo(x,y); c.lineTo(x+w-s,y); c.lineTo(x+w,y+s); c.lineTo(x+w,y+h); c.lineTo(x,y+h); c.close(); c.fillAndStroke();
  c.begin(); c.moveTo(x+w-s,y); c.lineTo(x+w-s,y+s); c.lineTo(x+w,y+s); c.end(); c.stroke(); };
mxCellRenderer.registerShape('note', NoteShape);
window.renderPage=function(xml){
  var el=document.getElementById('g'); el.innerHTML=''; el.style.width='3000px'; el.style.height='3000px';
  var graph=new mxGraph(el); graph.setHtmlLabels(true); graph.setEnabled(false);
  graph.foldingEnabled=false;
  var doc=mxUtils.parseXml(xml); var model=doc.getElementsByTagName('mxGraphModel')[0];
  new mxCodec(doc).decode(model, graph.getModel());
  var b=graph.getGraphBounds(); var pad=12;
  graph.view.setTranslate(-b.x+pad,-b.y+pad);
  el.style.width=Math.ceil(b.width+2*pad)+'px'; el.style.height=Math.ceil(b.height+2*pad)+'px';
  return [Math.ceil(b.width+2*pad), Math.ceil(b.height+2*pad)];
};
</script></body></html>
