# App VM (Option C, docs/deployment/milestone-3-architecture.md): reverse proxy with TLS,
# API, PostgreSQL. NO Docker socket here. Run from the repository root:
#
#   cp deploy/app.env.example deploy/app.env   # fill in; never commit app.env
#   docker compose -f deploy/compose.app.yaml --env-file deploy/app.env up -d --build
#
# Nothing here has been deployed. Owner Gate B is required before any host runs it.
name: codeadapt-app

# Every database connection uses TLS and verifies the server's certificate and name
# (owner decision R5): the CA certificate made by deploy/db-tls/make-db-certs.sh.
x-db-ca: &db-ca "${DB_TLS_DIR:?}/ca.crt:/etc/codeadapt/db-ca.crt:ro"

x-api-env: &api-env
  CODEADAPT_ENV: production
  CODEADAPT_DATABASE_URL: postgresql+psycopg://${API_DB_USER:?}:${API_DB_PASSWORD:?}@db:5432/${DB_NAME:?}?sslmode=verify-full&sslrootcert=/etc/codeadapt/db-ca.crt
  CODEADAPT_ALLOWED_HOSTS: ${SITE_HOST:?}
  # The proxy's fixed address on the internal network below: uvicorn trusts forwarded
  # headers from it only (never '*').
  FORWARDED_ALLOW_IPS: 172.30.0.10

services:
  db:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_OWNER_USER:?}  # owns the schema; used for migrations only
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    # R5: TLS on, at least TLS 1.2, and pg_hba.conf refuses every TCP connection without it.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${DB_TLS_DIR:?}/server.crt:/etc/postgresql/tls/server.crt:ro
      - ${DB_TLS_DIR:?}/server.key:/etc/postgresql/tls/server.key:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    # Published on the App VM's PRIVATE address only, for the runner VM. Never 0.0.0.0 on
    # a public interface; the host firewall also allows 5432 from the runner only.
    ports: ["${DB_PRIVATE_BIND:?}:5432:5432"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: .., dockerfile: deploy/backend.Dockerfile, target: api }
    image: codeadapt-api:${IMAGE_TAG:-local}
    environment:
      CODEADAPT_ENV: production
      CODEADAPT_DATABASE_URL: postgresql+psycopg://${DB_OWNER_USER:?}:${DB_OWNER_PASSWORD:?}@db:5432/${DB_NAME:?}?sslmode=verify-full&sslrootcert=/etc/codeadapt/db-ca.crt
    command: ["alembic", "upgrade", "head"]
    depends_on: { db: { condition: service_healthy } }
    volumes: [*db-ca]
    networks: [internal]
    restart: "no"

  db-setup:
    # As the schema owner: create or update the API and worker login roles and apply the
    # least-privilege grants (ADR-042). Idempotent; runs after every migration.
    image: codeadapt-api:${IMAGE_TAG:-local}
    environment:
      CODEADAPT_ENV: production
      CODEADAPT_DATABASE_URL: postgresql+psycopg://${DB_OWNER_USER:?}:${DB_OWNER_PASSWORD:?}@db:5432/${DB_NAME:?}?sslmode=verify-full&sslrootcert=/etc/codeadapt/db-ca.crt
      CODEADAPT_API_DB_PASSWORD: ${API_DB_PASSWORD:?}
      CODEADAPT_WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?}
    command:
      ["codeadapt-admin", "db-setup", "--api-role", "${API_DB_USER:?}", "--worker-role", "${WORKER_DB_USER:?}"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    volumes: [*db-ca]
    networks: [internal]
    restart: "no"

  admin:
    # One-off administration as the schema owner (owner decision R7): the API role can
    # neither change nor delete audit rows, so erase-learner (and, for consistency,
    # purge-sessions) run here. Never started by `up`; use
    #   docker compose ... run --rm admin erase-learner <code-name> [--apply]
    profiles: [admin]
    image: codeadapt-api:${IMAGE_TAG:-local}
    environment:
      CODEADAPT_ENV: production
      CODEADAPT_DATABASE_URL: postgresql+psycopg://${DB_OWNER_USER:?}:${DB_OWNER_PASSWORD:?}@db:5432/${DB_NAME:?}?sslmode=verify-full&sslrootcert=/etc/codeadapt/db-ca.crt
    entrypoint: ["codeadapt-admin"]
    depends_on: { db: { condition: service_healthy } }
    volumes: [*db-ca]
    networks: [internal]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    image: codeadapt-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment: *api-env
    depends_on: { db-setup: { condition: service_completed_successfully } }
    volumes: [*db-ca]
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  proxy:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    image: codeadapt-proxy:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_HOST:?}
      API_UPSTREAM: api:8000
    ports: ["80:80", "443:443"]
    volumes: ["caddydata:/data", "caddyconfig:/config"]
    depends_on: [api]
    networks:
      internal: { ipv4_address: 172.30.0.10 }
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  internal:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]

volumes:
  pgdata:
  caddydata:  # TLS certificates and keys
  caddyconfig:
