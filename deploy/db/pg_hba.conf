# PostgreSQL client authentication for the App VM database (owner decision R5, Gate B).
# Every TCP connection must use TLS, from the API on the internal network and from the
# runner VM alike; clients verify the server with sslmode=verify-full. Connections over
# the container's own Unix socket (health check, operator psql via `docker compose exec`)
# stay as the image sets them up.
#
# TYPE      DATABASE  USER  ADDRESS  METHOD
local       all       all            trust
hostssl     all       all   all      scram-sha-256
hostnossl   all       all   all      reject
