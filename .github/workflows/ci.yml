name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    # Lint, types, unit tests and the dependency audit: everything that needs no sandbox.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy
      - name: Tests without the sandbox
        run: uv run pytest --ignore=tests/sandbox
      - name: Dependency audit
        run: |
          uv export --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt

  backend-postgres:
    # The same non-sandbox tests against PostgreSQL 16, the deployment database (ADR-004):
    # every test gets a fresh database, migrated from scratch.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked
      - name: Tests without the sandbox, on PostgreSQL
        env:
          CODEADAPT_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: uv run pytest --ignore=tests/sandbox

  sandbox:
    # The sandbox tests, split across runners so the four long pipeline tests run side by
    # side instead of one after another. Each shard is a separate VM, so shards do not load
    # each other. "core" takes every sandbox test file not named by another shard, so a new
    # file is never left out.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: demo-content
            tests: tests/sandbox/test_demo_content.py
          - shard: heldout-evaluation
            tests: tests/sandbox/test_evaluation_harness.py
          - shard: end-to-end
            tests: tests/sandbox/test_end_to_end.py
          - shard: adaptation
            tests: tests/sandbox/test_adaptation_end_to_end.py
          - shard: families
            tests: tests/sandbox/test_family_end_to_end.py
          - shard: core
            tests: >-
              tests/sandbox
              --ignore=tests/sandbox/test_demo_content.py
              --ignore=tests/sandbox/test_evaluation_harness.py
              --ignore=tests/sandbox/test_end_to_end.py
              --ignore=tests/sandbox/test_adaptation_end_to_end.py
              --ignore=tests/sandbox/test_family_end_to_end.py
    name: sandbox (${{ matrix.shard }})
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked
      - name: Build sandbox image
        working-directory: .
        run: docker build -t codeadapt-sandbox:gcc14.2-1 sandbox/
      - name: Tests (sandbox tests required, never skipped in CI)
        env:
          CODEADAPT_REQUIRE_SANDBOX: "1"
        run: uv run pytest ${{ matrix.tests }}
      - name: No sandbox leftovers
        run: |
          test -z "$(docker ps -aq --filter label=org.codeadapt.sandbox=1)"
          test -z "$(docker volume ls -q --filter label=org.codeadapt.sandbox=1)"

  sandbox-postgres:
    # The two full pipeline tests (API -> queue -> worker -> sandbox -> diagnosis -> evidence
    # -> learner model -> recommendation) on PostgreSQL 16, the deployment database.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked
      - name: Build sandbox image
        working-directory: .
        run: docker build -t codeadapt-sandbox:gcc14.2-1 sandbox/
      - name: End-to-end sandbox tests on PostgreSQL
        env:
          CODEADAPT_REQUIRE_SANDBOX: "1"
          CODEADAPT_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          uv run pytest tests/sandbox/test_end_to_end.py
          tests/sandbox/test_adaptation_end_to_end.py

  sandbox-gvisor:
    # The production runtime (ADR-003, ADR-028): every sandbox test under gVisor, in the same
    # shards as the runc job.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: demo-content
            tests: tests/sandbox/test_demo_content.py
          - shard: heldout-evaluation
            tests: tests/sandbox/test_evaluation_harness.py
          - shard: end-to-end
            tests: tests/sandbox/test_end_to_end.py
          - shard: adaptation
            tests: tests/sandbox/test_adaptation_end_to_end.py
          - shard: families
            tests: tests/sandbox/test_family_end_to_end.py
          - shard: core
            tests: >-
              tests/sandbox
              --ignore=tests/sandbox/test_demo_content.py
              --ignore=tests/sandbox/test_evaluation_harness.py
              --ignore=tests/sandbox/test_end_to_end.py
              --ignore=tests/sandbox/test_adaptation_end_to_end.py
              --ignore=tests/sandbox/test_family_end_to_end.py
    name: sandbox-gvisor (${{ matrix.shard }})
    defaults:
      run:
        working-directory: backend
    env:
      GVISOR_RELEASE: "20261005"
      GVISOR_SHA512: 79869ae9a589355a46d46fdac068d9a954e741741ffe77c64e38c56ea955498c1cb04e9bce44e1cce5155333e6b76bee72347c6661bb7c78fd2fe3aad198c8fe
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked
      - name: Install gVisor (pinned release, checksum verified)
        working-directory: /tmp
        run: |
          curl -fsSLO "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.bz2"
          echo "${GVISOR_SHA512}  gvisor.tar.bz2" | sha512sum -c -
          mkdir gvisor && tar -xjf gvisor.tar.bz2 -C gvisor
          sudo install -m 755 gvisor/runsc gvisor/containerd-shim-runsc-v1 /usr/local/bin/
          sudo mkdir -p /usr/local/bin/gvisor-bin && sudo install -m 755 gvisor/gvisor-bin/* /usr/local/bin/gvisor-bin/
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
      - name: Build sandbox image
        working-directory: .
        run: docker build -t codeadapt-sandbox:gcc14.2-1 sandbox/
      - name: Sandbox tests under runsc
        env:
          CODEADAPT_REQUIRE_SANDBOX: "1"
          CODEADAPT_SANDBOX_RUNTIME: runsc
        run: uv run pytest ${{ matrix.tests }}
      - name: Production worker starts only under a registered gVisor runtime (ADR-040)
        if: matrix.shard == 'core'
        env:
          CODEADAPT_ENV: production
          CODEADAPT_DATABASE_URL: sqlite:////tmp/prod-check.sqlite3
        run: |
          uv run alembic upgrade head
          CODEADAPT_SANDBOX_RUNTIME=runsc uv run codeadapt-worker --once
          if uv run codeadapt-worker --once 2> /tmp/runc.err; then
            echo "production worker started without gVisor"; exit 1
          fi
          grep -q "requires CODEADAPT_SANDBOX_RUNTIME=runsc" /tmp/runc.err
          if CODEADAPT_SANDBOX_RUNTIME=runsc-missing uv run codeadapt-worker --once 2> /tmp/missing.err; then
            echo "production worker started with an unregistered runtime"; exit 1
          fi
          grep -q "not registered" /tmp/missing.err
      - name: No sandbox leftovers
        run: |
          test -z "$(docker ps -aq --filter label=org.codeadapt.sandbox=1)"
          test -z "$(docker volume ls -q --filter label=org.codeadapt.sandbox=1)"

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - name: API types are up to date with the backend
        run: |
          (cd ../backend && uv sync --locked && uv run codeadapt-openapi) > openapi.json
          npm run api:types
          git diff --exit-code -- openapi.json src/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: Build sandbox image
        run: docker build -t codeadapt-sandbox:gcc14.2-1 sandbox/
      - name: Install
        run: |
          (cd backend && uv sync --locked)
          (cd web && npm ci && npx playwright install --with-deps chromium)
      - name: Browser end-to-end test (API + worker + sandbox + UI)
        working-directory: web
        run: npx playwright test

  compose:
    # Checks that the development stack builds and serves from a fresh clone.
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Login-mode demo overlay is valid
        run: docker compose -f compose.yaml -f compose.demo.yaml config -q
      - name: Build
        run: docker compose build
      - name: Start
        run: docker compose up -d
      - name: API and web respond
        run: |
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/v1/problems | grep -q lower-bound
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:5173/ | grep -q '<div id="root">' && break; sleep 2; done
          curl -fs http://127.0.0.1:5173/ | grep -q '<div id="root">'
      - name: A submission is processed by the worker
        run: |
          id=$(curl -fs -X POST http://127.0.0.1:8000/api/v1/submissions -H 'Content-Type: application/json' \
            --data "$(jq -n --rawfile s content/demo/lower-bound/reference.cpp '{problem_slug:"lower-bound",source:$s}')" | jq -r .id)
          # The first submission measures the problem's fingerprints; on a 2-vCPU runner
          # wall-only stops are re-run (ADR-023 D1), so allow up to 15 minutes.
          for i in $(seq 1 450); do
            status=$(curl -fs http://127.0.0.1:8000/api/v1/submissions/$id | jq -r .status)
            [ "$status" = completed ] && break; sleep 2
          done
          echo "status after $((i * 2)) s: $status"
          curl -fs http://127.0.0.1:8000/api/v1/submissions/$id | jq -e '.feedback.kind == "all_tests_passed"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v

  production-images:
    # ADR-042 / Milestone 3: the production images build, run as non-root, and the App VM
    # stack serves the web build and API over HTTPS with its headers. TLS here uses Caddy's
    # internal CA for "localhost": CI-level evidence only, never proof of TLS on a host.
    runs-on: ubuntu-24.04
    needs: [backend, web]
    env:
      APP_ENV: /tmp/app.env
    steps:
      - uses: actions/checkout@v4
      - name: Build API, worker and proxy images
        run: |
          docker build -f deploy/backend.Dockerfile --target api -t codeadapt-api:local .
          docker build -f deploy/backend.Dockerfile --target worker -t codeadapt-worker:local .
          docker build -f deploy/web.Dockerfile -t codeadapt-proxy:local .
      - name: Images run as non-root
        run: |
          for image in codeadapt-api:local codeadapt-worker:local; do
            uid=$(docker run --rm --entrypoint id "$image" -u)
            echo "$image uid=$uid"; test "$uid" != 0
          done
      - name: Compose files refuse to start without their settings
        run: |
          # (`! cmd` would not stop a bash -e step, so test explicitly.)
          if docker compose -f deploy/compose.app.yaml config -q 2>/dev/null; then exit 1; fi
          if docker compose -f deploy/compose.runner.yaml config -q 2>/dev/null; then exit 1; fi
      - name: Database TLS certificates from a private CA (R5)
        run: |
          bash deploy/db-tls/make-db-certs.sh /tmp/db-tls db.codeadapt.internal
          sudo chown 0:70 /tmp/db-tls/server.key
          # An unrelated private CA, for the tests that must be refused.
          bash deploy/db-tls/make-db-certs.sh /tmp/rogue-tls db.codeadapt.internal
      - name: Start the App VM stack (localhost, generated passwords)
        run: |
          {
            echo DB_TLS_DIR=/tmp/db-tls
            echo SITE_HOST=localhost
            echo DB_NAME=codeadapt
            echo DB_OWNER_USER=codeadapt_owner
            echo "DB_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo API_DB_USER=codeadapt_api
            echo "API_DB_PASSWORD=$(openssl rand -hex 24)"
            echo WORKER_DB_USER=codeadapt_worker
            echo "WORKER_DB_PASSWORD=$(openssl rand -hex 24)"
            echo DB_PRIVATE_BIND=127.0.0.1
            echo IMAGE_TAG=local
          } > "$APP_ENV"
          docker compose -f deploy/compose.app.yaml --env-file "$APP_ENV" up -d --no-build
      - name: HTTPS, readiness and headers through the proxy
        run: |
          for i in $(seq 1 60); do curl -fsk https://localhost/api/v1/ready && break; sleep 2; done
          curl -fsk https://localhost/api/v1/ready | jq -e '.status == "ready"'
          curl -sk https://localhost/api/v1/problems -o /dev/null -w '%{http_code}\n' | grep -q 401
          curl -fsk https://localhost/ | grep -q '<div id="root">'
          web=$(curl -fsk -D - -o /dev/null https://localhost/)
          echo "$web"
          for h in strict-transport-security content-security-policy x-frame-options x-content-type-options; do
            echo "$web" | grep -qi "^$h:"
          done
          api=$(curl -fsk -D - -o /dev/null https://localhost/api/v1/health)
          echo "$api" | grep -qi '^strict-transport-security:'
          echo "$api" | grep -qi "^content-security-policy: default-src 'none'"
          # Plain HTTP is redirected to HTTPS.
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://localhost/ | grep -q '^308 https://'
          # An unknown Host is refused by the API itself (ADR-040).
          docker compose -f deploy/compose.app.yaml --env-file "$APP_ENV" exec -T api python -c "
          import urllib.error, urllib.request as u
          try:
              u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/health', headers={'Host': 'evil.example'}))
          except urllib.error.HTTPError as e:
              assert e.code == 400, e.code
          else:
              raise SystemExit('unknown Host was accepted')
          "
          # The API container reports healthy (its health check sends an allowed Host).
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f deploy/compose.app.yaml --env-file "$APP_ENV" ps -q api)")
            [ "$s" = healthy ] && break; sleep 2
          done
          echo "api health: $s"; test "$s" = healthy
      - name: Least-privilege database roles are in force
        run: |
          set -a; . "$APP_ENV"; set +a
          q() { docker compose -f deploy/compose.app.yaml --env-file "$APP_ENV" exec -T db \
                psql -v ON_ERROR_STOP=1 -U "$DB_OWNER_USER" -d "$DB_NAME" -c "$1"; }
          q "SET ROLE codeadapt_worker; SELECT count(*) FROM jobs"
          if q "SET ROLE codeadapt_worker; SELECT count(*) FROM users"; then exit 1; fi
          if q "SET ROLE codeadapt_api; CREATE TABLE intruder (x int)"; then exit 1; fi
          # R7: the API role can add to the audit log but not rewrite it, and cannot write
          # the schema revision.
          q "SET ROLE codeadapt_api; SELECT count(*) FROM audit_events"
          if q "SET ROLE codeadapt_api; DELETE FROM audit_events"; then exit 1; fi
          if q "SET ROLE codeadapt_api; UPDATE audit_events SET target = ''"; then exit 1; fi
          if q "SET ROLE codeadapt_api; UPDATE alembic_version SET version_num = 'x'"; then exit 1; fi
          # Owner-only administration runs through the admin service, over verified TLS.
          docker compose -f deploy/compose.app.yaml --env-file "$APP_ENV" --profile admin \
            run --rm admin purge-sessions
      - uses: astral-sh/setup-uv@v5
      - name: Database TLS, valid and invalid certificates, as the worker role (R5)
        working-directory: backend
        run: |
          set -a; . "$APP_ENV"; set +a
          uv sync --locked
          CODEADAPT_TEST_TLS_REQUIRED=1 \
          CODEADAPT_TEST_TLS_HOSTADDR=127.0.0.1 CODEADAPT_TEST_TLS_PORT=5432 \
          CODEADAPT_TEST_TLS_NAME=db.codeadapt.internal \
          CODEADAPT_TEST_TLS_CA=/tmp/db-tls/ca.crt CODEADAPT_TEST_TLS_ROGUE_CA=/tmp/rogue-tls/ca.crt \
          CODEADAPT_TEST_TLS_USER="$WORKER_DB_USER" CODEADAPT_TEST_TLS_PASSWORD="$WORKER_DB_PASSWORD" \
          CODEADAPT_TEST_TLS_DBNAME="$DB_NAME" \
            uv run pytest tests/tls -v -p no:cacheprovider
      - name: Build sandbox image (so the worker gets past the image check to the gVisor check)
        run: docker build -t codeadapt-sandbox:gcc14.2-1 sandbox/
      - name: Production worker refuses to start without gVisor (runner has runc only)
        run: |
          {
            echo DB_HOST=127.0.0.1
            echo DB_TLS_NAME=db.codeadapt.internal
            echo DB_CA_FILE=/tmp/db-tls/ca.crt
            echo DB_NAME=codeadapt
            echo WORKER_DB_USER=codeadapt_worker
            echo WORKER_DB_PASSWORD=unused-in-this-check
            echo "DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)"
            echo IMAGE_TAG=local
          } > /tmp/runner.env
          set +e
          out=$(docker compose -f deploy/compose.runner.yaml --env-file /tmp/runner.env run --rm --no-deps worker 2>&1)
          code=$?
          set -e
          echo "$out" | tail -5
          test "$code" -ne 0
          echo "$out" | grep -q "runtime 'runsc' is not registered"
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.app.yaml --env-file "$APP_ENV" logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f deploy/compose.app.yaml --env-file "$APP_ENV" down -v || true
